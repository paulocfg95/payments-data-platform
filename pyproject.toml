[project]
name = "payments-data-platform"
version = "0.1.0"
description = "Small data platform for payments: BCB data + synthetic transactions, Airflow, dbt, PostgreSQL."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
